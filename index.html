<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b30"><meta name="description" content="광고 없이, 시간제한 없이. 회전과 콤보로 즐기는 블루 블록 퍼즐."><title>BLUE BLOCK · 블루 블록</title><link rel="stylesheet" href="style.css?v=10"></head>
<body><main><header><div class="brand"><i aria-hidden="true"><b></b><b></b><b></b></i><div>BLUE BLOCK<span>블루 블록 · 나만의 페이스로</span></div></div><button id="sound" aria-label="소리 켜기">♪</button><button id="settings" aria-label="설정">⚙</button><button id="help" aria-label="게임 방법">?</button></header>
<section class="scores"><div class="best"><small>BEST RECORD</small><div>♛ <span id="best">0</span></div></div><div class="current"><small>SCORE</small><span id="score">0</span></div><button id="restart" aria-label="새 게임">↻</button></section>
<section class="journey" aria-label="다음 점수 목표"><div><span id="stageLabel">01 · WARM UP</span><span id="goalLabel">다음 목표 500</span></div><div id="goalTrack" role="progressbar" aria-label="다음 목표 진행도" aria-valuemin="0" aria-valuemax="100"><i id="goalFill"></i></div></section>
<div class="board-heading"><span id="modeLabel">기본 모드</span><span>8 × 8</span></div><div class="play"><div id="board" role="grid" aria-label="8 곱하기 8 퍼즐 보드"></div><div id="message" aria-live="polite"></div></div>
<div id="comboStatus" aria-live="polite"></div><div id="tray" aria-label="사용할 블록"></div><div class="tools"><button id="undo" disabled><span>↶</span> 한 수 되돌리기</button><button id="hintButton"><span>✧</span> 힌트 <b id="hintCount">3</b></button></div><p class="hint">블록을 톡 누르면 회전 · 끌어서 배치</p><footer><i></i> 광고 없이, 시간제한 없이.</footer></main>
<dialog id="modal"><div id="dialogContent"></div><button id="close">계속하기</button></dialog><script src="game.js?v=10"></script></body></html>
