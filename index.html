<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#243d75"><title>블루 블록 · 광고 없는 블록 퍼즐</title><link rel="stylesheet" href="style.css?v=20261104-1"></head><body><main><header><div class="brand">BLUE BLOCK<span>블루 블록</span></div><button id="sound" aria-label="소리 켜기">♪</button><button id="settings" aria-label="설정">⚙</button><button id="help" aria-label="게임 방법">?</button></header><section class="scores"><div class="best">♛ <span id="best">0</span><small>최고 기록</small></div><div class="current"><span id="score">0</span><small>점수</small></div><button id="restart" aria-label="새 게임">↻</button></section><div class="play"><div id="board" role="grid" aria-label="8 곱하기 8 퍼즐 보드"></div><div id="message" aria-live="polite"></div></div><div id="comboStatus" aria-live="polite"></div><div id="tray" aria-label="사용할 블록"></div><button id="undo" class="undo" disabled>↶ 한 수 되돌리기</button><p class="hint">블록을 누르면 회전 · 끌어서 배치</p><footer><span id="modeLabel">기본 모드</span> · 광고 없이, 시간제한 없이.</footer></main><dialog id="modal"><div id="dialogContent"></div><button id="close">계속하기</button></dialog><script src="game.js?v=20261104-1"></script></body></html>
